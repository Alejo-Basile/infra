# Traefik v3 — configuracion estatica (S0-P1-03 / S1-P1-01, variante local)
# Entrypoint unico: api.localhost (control) y s3.localhost (datos, MinIO).
# Variante LOCAL: TLS via mkcert (ver scripts/gen-certs.sh y ADR-0016).
# En produccion esto se reemplaza por ACME (Let's Encrypt, staging primero).

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    # S7-P1-03: Traefik solo acepta X-Forwarded-For del salto inmediato.
    # trustedIPs se compara contra el peer del socket, no contra toda la
    # cadena de la cabecera: se declara el proxy que tenemos delante, no
    # "quien dice ser". Si el peer no esta en la lista, Traefik descarta el
    # XFF entrante y propaga como origen el peer real.
    # En v3 forwardedHeaders es campo del entryPoint (hermano de `address`),
    # NO hijo de `http`: anidarlo bajo `http` aborta el arranque.
    forwardedHeaders:
      # Explicito aunque sea el default de v3: deja la postura auditable.
      insecure: false
      trustedIPs:
        # LABORATORIO: TEST-NET-1 (RFC 5737). No incluye ningun peer de
        # Docker, por lo que TODO XFF entrante se ignora y la prueba de
        # falsificacion es valida. En produccion va el CIDR del LB/ingress.
        - "192.0.2.0/24"
    http:
      tls: true
  # Puerto interno de metricas (solo red interna, sin publicar al host)
  metrics:
    address: ":8082"

providers:
  docker:
    # Sin exposicion por defecto: cada servicio opta-in con traefik.enable=true
    exposedByDefault: false
    network: infra_internal
  file:
    directory: /etc/traefik/dynamic
    watch: true

api:
  # Dashboard SOLO en localhost del contenedor; no hay router que lo exponga.
  dashboard: false

ping: {} # healthcheck interno (traefik healthcheck --ping)

metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true

accessLog:
  format: json
  fields:
    headers:
      names:
        # Traefik OSS does not generate correlation IDs (no UUID middleware).
        # doc-service generates one when the client omits X-Correlation-Id
        # (SPEC §10); this field only preserves an inbound value in the log.
        X-Correlation-Id: keep
