# Middlewares (file provider) — S0-P1-03 / S1-P1-16. Ruteo en routing.yml.
http:
  middlewares:
    # P1-05: version minima con clave estatica; el bucket es global.
    # Identidad por IP/API key queda para S7 (ADR-0005).
    rate-limit:
      forwardAuth:
        address: "http://ratelimitd:8090/check?key=api-v2&rate=10&burst=20"
        authResponseHeaders:
          - Retry-After
          - X-RateLimit-Limit
          - X-RateLimit-Remaining
          - X-RateLimit-Reset
          - X-RateLimit-Retry-After
          - X-RateLimit-Degraded

    # Limite de tamano SOLO para endpoints JSON (SPEC §3.1 / ADR-0011):
    # el PDF NO pasa por el gateway (subida directa a MinIO via URL
    # prefirmada POST); el limite real del PDF vive en la politica
    # content-length-range del presign, no aqui.
    body-limit-1mb:
      buffering:
        maxRequestBodyBytes: 1048576   # 1 MB
