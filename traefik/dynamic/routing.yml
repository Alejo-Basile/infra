# Ruteo final (S8-P1-02). Una sola fuente de verdad del gateway.
# Los servidores doc-service se descubren por replica via el Docker provider (docv2@docker).
# Reemplaza los routers que vivian en labels Docker (compose).
# Desviacion deliberada: los 11 routers del inventario conservan
# middlewares: [rate-limit@file, sec-headers@file] porque el router `legacy` que reemplazan
# aplicaba rate-limit@file (labels del monolito en docker-compose.yml). No se
# agrega body-limit-1mb@file (nunca aplico alli). r-doc-healthz y s3-api sin
# middlewares.
http:
  routers:
    # --- Inventario v1 (S0-P4-01): regla explicita por ruta -----------------
    r-inv-health:
      rule: "Host(`api.localhost`) && Path(`/health`) && Method(`GET`)"
      entryPoints: [websecure]
      tls: true
      service: legacy-monolito
      priority: 200
      middlewares: [rate-limit@file, sec-headers@file]

    r-inv-health-ready:
      rule: "Host(`api.localhost`) && Path(`/health/ready`) && Method(`GET`)"
      entryPoints: [websecure]
      tls: true
      service: legacy-monolito
      priority: 200
      middlewares: [rate-limit@file, sec-headers@file]

    r-inv-pdf-process:
      rule: "Host(`api.localhost`) && Path(`/pdf/process`) && Method(`POST`)"
      entryPoints: [websecure]
      tls: true
      service: r-inv-pdf-process-weighted
      priority: 200
      middlewares: [rate-limit@file, sec-headers@file]

    r-inv-registros:
      rule: "Host(`api.localhost`) && Path(`/registros`) && Method(`GET`)"
      entryPoints: [websecure]
      tls: true
      service: r-inv-registros-weighted
      priority: 200
      middlewares: [rate-limit@file, sec-headers@file]

    r-inv-registros-hash:
      rule: "Host(`api.localhost`) && PathRegexp(`^/registros/hash/[0-9a-fA-F]{64}$`) && Method(`GET`)"
      entryPoints: [websecure]
      tls: true
      service: legacy-monolito
      priority: 210
      middlewares: [rate-limit@file, sec-headers@file]

    r-inv-registros-id:
      rule: "Host(`api.localhost`) && PathRegexp(`^/registros/[0-9a-fA-F-]{36}$`) && Method(`GET`)"
      entryPoints: [websecure]
      tls: true
      service: r-inv-registros-id-weighted
      priority: 200
      middlewares: [rate-limit@file, sec-headers@file]

    r-inv-registros-put:
      rule: "Host(`api.localhost`) && PathRegexp(`^/registros/[0-9a-fA-F-]{36}$`) && Method(`PUT`)"
      entryPoints: [websecure]
      tls: true
      service: legacy-monolito
      priority: 200
      middlewares: [rate-limit@file, sec-headers@file]

    r-inv-registros-delete:
      rule: "Host(`api.localhost`) && PathRegexp(`^/registros/[0-9a-fA-F-]{36}$`) && Method(`DELETE`)"
      entryPoints: [websecure]
      tls: true
      service: legacy-monolito
      priority: 200
      middlewares: [rate-limit@file, sec-headers@file]

    r-inv-docs:
      rule: "Host(`api.localhost`) && Path(`/docs`) && Method(`GET`)"
      entryPoints: [websecure]
      tls: true
      service: legacy-monolito
      priority: 200
      middlewares: [rate-limit@file, sec-headers@file]

    r-inv-redoc:
      rule: "Host(`api.localhost`) && Path(`/redoc`) && Method(`GET`)"
      entryPoints: [websecure]
      tls: true
      service: legacy-monolito
      priority: 200
      middlewares: [rate-limit@file, sec-headers@file]

    r-inv-openapi:
      rule: "Host(`api.localhost`) && Path(`/openapi.json`) && Method(`GET`)"
      entryPoints: [websecure]
      tls: true
      service: legacy-monolito
      priority: 200
      middlewares: [rate-limit@file, sec-headers@file]

    # --- Camino nuevo (v2) ------------------------------------------------
    r-api-v2:
      rule: "Host(`api.localhost`) && PathPrefix(`/api/v2`)"
      entryPoints: [websecure]
      tls: true
      service: r-api-v2-weighted
      priority: 300
      middlewares: [rate-limit@file, body-limit-1mb@file, sec-headers@file]

    r-doc-healthz:
      rule: "Host(`api.localhost`) && Path(`/healthz`)"
      entryPoints: [websecure]
      tls: true
      service: docv2@docker
      priority: 300
      middlewares: [sec-headers@file]

    # --- Host S3 (S1-P1-16) ----------------------------------------------
    s3-api:
      rule: "Host(`s3.localhost`)"
      entryPoints: [websecure]
      tls: true
      service: minio-s3
      priority: 100
      middlewares: [sec-headers@file]

    # S11-P1-C09: UI de Consul, solo por Traefik y con basic auth.
    r-consul-ui:
      rule: "Host(`consul.localhost`)"
      entryPoints: [websecure]
      tls: true
      service: consul-ui
      priority: 300
      middlewares: [consul-ui-auth@file, sec-headers@file, consul-ui-root@file]

    # Grafana: unico acceso es por el gateway; no publica puerto al host.
    # La autenticacion la resuelve Grafana (admin + password file).
    r-grafana:
      rule: "Host(`grafana.localhost`)"
      entryPoints: [websecure]
      tls: true
      service: grafana
      priority: 300
      middlewares: [sec-headers@file]

  services:
    legacy-monolito:
      loadBalancer:
        servers:
          - url: "http://monolito:8000"

    # docv2-canary stays a static file-provider child: a weighted child must
    # always exist, and it is single-instance by design. Keeping it static
    # guarantees the weighted router stays valid even with the canary stopped.
    # docv2-canary: servicio canary ahora declarado en compose (weight 0 por
    # defecto). Promocion via set-canary-weight.sh.
    docv2-canary:
      loadBalancer:
        servers:
          - url: "http://doc-service-canary:8080"

    minio-s3:
      loadBalancer:
        servers:
          - url: "http://minio:9000"

    consul-ui:
      loadBalancer:
        servers:
          - url: "https://consul:8501"
        serversTransport: consul-ui-transport@file

    grafana:
      loadBalancer:
        servers:
          - url: "http://grafana:3000"

    r-inv-pdf-process-weighted:
      weighted:
        services:
          - name: legacy-monolito
            weight: 100
          - name: docv2@docker
            weight: 0

    r-inv-registros-weighted:
      weighted:
        services:
          - name: legacy-monolito
            weight: 100
          - name: docv2@docker
            weight: 0

    r-inv-registros-id-weighted:
      weighted:
        services:
          - name: legacy-monolito
            weight: 100
          - name: docv2@docker
            weight: 0

    r-api-v2-weighted:
      weighted:
        services:
          - name: docv2@docker
            weight: 100
          - name: docv2-canary
            weight: 0

  serversTransports:
    # S11-P1-C09: confia en la CA local de Consul (sin insecureSkipVerify).
    consul-ui-transport:
      serverName: consul
      rootCAs:
        - /run/secrets/consul_ca_cert
      insecureSkipVerify: false
