# Loki — logs JSON con correlation_id (SPEC §10)
auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h # 7 dias en dev
  # El shipper (promtail) arranca leyendo el backlog de Docker, que incluye
  # entradas de hasta 7 dias atras. Con el rechazo por antiguedad activo Loki
  # devuelve 400 por cada lote y ensucia el log de promtail sin aportar nada:
  # las entradas fuera de `retention_period` igual se descartan por retencion.
  reject_old_samples: false
