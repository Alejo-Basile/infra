# =============================================================================
# Compose v2 de desarrollo — infraestructura de la migración a microservicios
# SPEC.md v2.1 · plan-S0-P1.md (S0-P1-03 / 05 / 06 / 07)
#
# Perfiles:
#   core       -> MongoDB (RS) + Redis (streams y ratelimit) + MinIO + initers
#   full       -> core + Traefik + monolito (Strangler) + Prometheus/Grafana/Loki
#   chaos      -> utilidades para matar procesos (base del game day S9)
#   discovery  -> Consul server + agent + kv-sync (incluido en full)
#
# Uso:
#   docker compose --profile core up -d
#   docker compose --profile full up -d
# =============================================================================

name: infra

x-hardening: &hardening
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

# Los entrypoints oficiales de mongo/redis/minio arrancan como root y bajan a
# usuario no-root (setuid/chown): necesitan estas capabilities para arrancar.
# El hardening completo (read_only, etc.) se audita en S2 (S1-P1-15).
x-hardening-data: &hardening-data
  cap_drop: ["ALL"]
  cap_add: ["SETUID", "SETGID", "CHOWN", "DAC_OVERRIDE"]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

# -----------------------------------------------------------------------------
# REDES (S0-P1-05): ningún servicio de datos vive en `edge`.
# -----------------------------------------------------------------------------
networks:
  edge: # salida a internet: solo Traefik
    name: infra_edge
  internal: # servicios de aplicacion, sin salida a internet
    name: infra_internal
    internal: true
  data: # solo datos, sin salida a internet (Mongo, Redis, MinIO)
    name: infra_data
    internal: true

volumes:
  mongo-data:
  redis-streams-data:
  redis-streams-replica-1-data:
  redis-streams-replica-2-data:
  redis-ratelimit-data:
  minio-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  loki-data:
  ratelimitd-config-cache:
  promtail-positions:
  consul-data:
  consul-agent-data:
  worker-config-cache:
  doc-service-config-cache:

secrets:
  mongo_initdb_root_password: { file: ../secrets/mongo_initdb_root_password.txt }
  mongo_app_password: { file: ../secrets/mongo_app_password.txt }
  mongo_worker_password: { file: ../secrets/mongo_worker_password.txt }
  redis_streams_password: { file: ../secrets/redis_streams_password.txt }
  redis_streams_password_json: { file: ../secrets/redis_streams_password.json }
  redis_ratelimit_password: { file: ../secrets/redis_ratelimit_password.txt }
  minio_root_password: { file: ../secrets/minio_root_password.txt }
  minio_webhook_secret: { file: ../secrets/minio_webhook_secret.txt }
  internal_token: { file: ../secrets/internal_token.txt }
  grafana_admin_password: { file: ../secrets/grafana_admin_password.txt }
  svc_docservice_access_key: { file: ../secrets/svc_docservice_access_key.txt }
  svc_docservice_secret_key: { file: ../secrets/svc_docservice_secret_key.txt }
  svc_worker_access_key: { file: ../secrets/svc_worker_access_key.txt }
  svc_worker_secret_key: { file: ../secrets/svc_worker_secret_key.txt }
  ocr_minio_access_key: { file: ../secrets/ocr_minio_access_key.txt }
  ocr_minio_secret_key: { file: ../secrets/ocr_minio_secret_key.txt }
  ocr_mongo_password: { file: ../secrets/ocr_mongo_password.txt }
  consul_gossip_key: { file: ../secrets/consul_gossip_key.txt }
  consul_server_cert: { file: ../secrets/consul_server_cert.pem }
  consul_server_key: { file: ../secrets/consul_server_key.pem }
  consul_ca_cert: { file: ../secrets/consul_ca_cert.pem }
  consul_operator_token: { file: ../secrets/consul_operator_token.txt }
  consul_doc_service_token: { file: ../secrets/consul_doc_service_token.txt }
  consul_ratelimitd_token: { file: ../secrets/consul_ratelimitd_token.txt }
  consul_worker_token: { file: ../secrets/consul_worker_token.txt }
  consul_ocr_worker_token: { file: ../secrets/consul_ocr_worker_token.txt }
  consul_prometheus_token: { file: ../secrets/consul_prometheus_token.txt }
  consul_ui_password: { file: ../secrets/consul_ui_password.txt }
  consul_ui_users: { file: ../secrets/consul_ui_users.txt }

services:
  # ===========================================================================
  # PERFIL CORE — datos
  # ===========================================================================

  # --- MongoDB Replica Set (SPEC 3.6): transacciones y Change Streams -------
  mongo:
    image: mongo:7.0
    profiles: ["core", "full"]
    <<: *hardening-data
    command: ["--replSet", "rs0", "--bind_ip", "localhost,mongo", "--keyFile", "/etc/mongo/keyfile"]
    secrets: [mongo_initdb_root_password]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?definir en .env}
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_initdb_root_password
    volumes:
      - mongo-data:/data/db
      # keyFile requerido por auth+replSet. Se genera con scripts/bootstrap.sh
      # (openssl rand -base64 756) con dueño 999 y modo 400. NUNCA commitear.
      - ./mongo/keyfile:/etc/mongo/keyfile:ro
    networks: [data]
    mem_limit: 1g
    cpus: 1.0
    # MongoDB creates background/session threads under E2E load; 200 leaves
    # no headroom and makes the healthcheck fail with pthread_create errors.
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u $${MONGO_INITDB_ROOT_USERNAME} -p $$(cat /run/secrets/mongo_initdb_root_password) --authenticationDatabase admin --eval 'db.hello().isWritablePrimary'"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Inicializacion idempotente del RS y de los usuarios de aplicacion:
  #  - app:    readWrite sobre MONGO_DATABASE (doc-service)
  #  - worker: SOLO update sobre la coleccion documents (ADR-0006)
  mongo-init:
    image: mongo:7.0
    profiles: ["core", "full"]
    <<: *hardening-data
    depends_on:
      mongo:
        condition: service_started
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_APP_USER: ${MONGO_APP_USER:?definir en .env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?definir en .env}
      MONGO_WORKER_USER: ${MONGO_WORKER_USER:?definir en .env}
      MONGO_WORKER_PASSWORD: ${MONGO_WORKER_PASSWORD:?definir en .env}
      MONGO_DATABASE: ${MONGO_DATABASE:-documents}
      # Usuario legacy del monolito: su DSN fija authSource=admin.
      MONOLITO_MONGO_USER: ${MONOLITO_MONGO_USER:?definir en .env}
      MONOLITO_MONGO_PASSWORD: ${MONOLITO_MONGO_PASSWORD:?definir en .env}
      MONOLITO_MONGO_DB: ${MONOLITO_MONGO_DB:-pdf-extractext}
    volumes:
      - ./mongo/init.js:/init.js:ro
    # Espera a que mongod acepte conexiones antes de iniciar el RS. No se usa
    # `service_healthy` porque el healthcheck exige PRIMARY y el RS aún no
    # existe: sería un deadlock.
    entrypoint:
      - "/bin/sh"
      - "-c"
      - >
        until mongosh --host mongo:27017 --quiet --eval 'db.runCommand({ping:1}).ok' >/dev/null 2>&1; do sleep 2; done;
        exec mongosh --host mongo:27017 --quiet /init.js
    networks: [data]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    restart: "no"

  # --- Redis STREAMS (SPEC 3.5): AOF + noeviction — los trabajos NO se pierden
  redis-streams:
    image: redis:7.2
    profiles: ["core", "full"]
    <<: *hardening-data
    # `--masterauth` y `--replica-announce-ip` son inertes mientras sea primario,
    # pero necesarios si Sentinel lo degrada a replica tras un failover: sin
    # masterauth el enlace de replicacion queda en `down` (NOAUTH) y sin
    # announce-ip anunciaria una IP efimera 172.x.
    secrets: [redis_streams_password, redis_streams_password_json]
    entrypoint: ["/bin/sh", "-c", "export REDIS_STREAMS_PASSWORD=$$(cat /run/secrets/redis_streams_password); exec redis-server /usr/local/etc/redis/redis.conf --requirepass $$REDIS_STREAMS_PASSWORD --masterauth $$REDIS_STREAMS_PASSWORD --replica-announce-ip redis-streams"]
    volumes:
      - ./redis/streams.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-streams-data:/data
    networks: [data]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_streams_password)\" --no-auth-warning ping"]
      interval: 10s
      timeout: 3s
      retries: 6

  # --- Redis STREAMS replicas (S1-P1-08, plan-S2-P1.md §4) -------------------
  # Replicas del primario de Streams. Usan la MISMA config que el primario
  # (streams.conf: AOF everysec + noeviction) y su propio volumen. Sentinel
  # puede promoverlas ante la caida del primario. Perfil `sentinel`: no altera
  # el perfil `full` (el endpoint del cliente sigue siendo redis-streams:6379).
  redis-streams-replica-1:
    image: redis:7.2
    profiles: ["sentinel"]
    <<: *hardening-data
    # `--replica-announce-ip` con el NOMBRE del contenedor: sin esto el primario
    # reporta la IP efimera de la replica en INFO, Sentinel la aprende como IP y
    # al promover una replica anuncia 172.x a los clientes (el permiso de
    # `sentinel announce-hostnames` solo aplica a direcciones conocidas por
    # hostname). Con el hostname anunciado, el failover es estable.
    secrets: [redis_streams_password, redis_streams_password_json]
    # `--replica-announce-ip` con el NOMBRE del contenedor: sin esto el primario
    # reporta la IP efimera de la replica en INFO, Sentinel la aprende como IP y
    # al promover una replica anuncia 172.x a los clientes (el permiso de
    # `sentinel announce-hostnames` solo aplica a direcciones conocidas por
    # hostname). Con el hostname anunciado, el failover es estable.
    entrypoint: ["/bin/sh", "-c", "export REDIS_STREAMS_PASSWORD=$$(cat /run/secrets/redis_streams_password); exec redis-server /usr/local/etc/redis/redis.conf --requirepass $$REDIS_STREAMS_PASSWORD --replicaof redis-streams 6379 --masterauth $$REDIS_STREAMS_PASSWORD --replica-announce-ip redis-streams-replica-1"]
    volumes:
      - ./redis/streams.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-streams-replica-1-data:/data
    networks: [data]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_streams_password)\" --no-auth-warning ping"]
      interval: 10s
      timeout: 3s
      retries: 6

  redis-streams-replica-2:
    image: redis:7.2
    profiles: ["sentinel"]
    <<: *hardening-data
    # Igual que replica-1: anuncia su hostname para que Sentinel no propague IPs.
    secrets: [redis_streams_password, redis_streams_password_json]
    entrypoint: ["/bin/sh", "-c", "export REDIS_STREAMS_PASSWORD=$$(cat /run/secrets/redis_streams_password); exec redis-server /usr/local/etc/redis/redis.conf --requirepass $$REDIS_STREAMS_PASSWORD --replicaof redis-streams 6379 --masterauth $$REDIS_STREAMS_PASSWORD --replica-announce-ip redis-streams-replica-2"]
    volumes:
      - ./redis/streams.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-streams-replica-2-data:/data
    networks: [data]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_streams_password)\" --no-auth-warning ping"]
      interval: 10s
      timeout: 3s
      retries: 6

  # --- Sentinels (S1-P1-08, plan-S2-P1.md §4): quorum 2 de 3 ---------------
  # Monitorean el primario logico `myprimary`. `resolve-hostnames` y
  # `announce-hostnames` (en sentinel.conf.tmpl) evitan el fallo clasico de
  # Compose + Sentinel: anunciar IPs efimeras 172.x en lugar de los nombres.
  # El password NO vive en ningun archivo commiteado: sentinel-entrypoint.sh
  # sustituye ${REDIS_STREAMS_PASSWORD} en /tmp/sentinel.conf al arrancar.
  sentinel-1:
    image: redis:7.2
    profiles: ["sentinel"]
    <<: *hardening-data
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    secrets: [redis_streams_password, redis_streams_password_json]
    environment:
      REDIS_STREAMS_PASSWORD_FILE: /run/secrets/redis_streams_password
    entrypoint: ["/bin/sh", "/usr/local/etc/redis/sentinel-entrypoint.sh"]
    volumes:
      - ./redis/sentinel.conf.tmpl:/usr/local/etc/redis/sentinel.conf.tmpl:ro
      - ./redis/sentinel-entrypoint.sh:/usr/local/etc/redis/sentinel-entrypoint.sh:ro
    networks: [data]
    mem_limit: 128m
    pids_limit: 50
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/redis-cli -p 26379 ping"]
      interval: 10s
      timeout: 3s
      retries: 6

  sentinel-2:
    image: redis:7.2
    profiles: ["sentinel"]
    <<: *hardening-data
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    secrets: [redis_streams_password, redis_streams_password_json]
    environment:
      REDIS_STREAMS_PASSWORD_FILE: /run/secrets/redis_streams_password
    entrypoint: ["/bin/sh", "/usr/local/etc/redis/sentinel-entrypoint.sh"]
    volumes:
      - ./redis/sentinel.conf.tmpl:/usr/local/etc/redis/sentinel.conf.tmpl:ro
      - ./redis/sentinel-entrypoint.sh:/usr/local/etc/redis/sentinel-entrypoint.sh:ro
    networks: [data]
    mem_limit: 128m
    pids_limit: 50
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/redis-cli -p 26379 ping"]
      interval: 10s
      timeout: 3s
      retries: 6

  sentinel-3:
    image: redis:7.2
    profiles: ["sentinel"]
    <<: *hardening-data
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    secrets: [redis_streams_password, redis_streams_password_json]
    environment:
      REDIS_STREAMS_PASSWORD_FILE: /run/secrets/redis_streams_password
    entrypoint: ["/bin/sh", "/usr/local/etc/redis/sentinel-entrypoint.sh"]
    volumes:
      - ./redis/sentinel.conf.tmpl:/usr/local/etc/redis/sentinel.conf.tmpl:ro
      - ./redis/sentinel-entrypoint.sh:/usr/local/etc/redis/sentinel-entrypoint.sh:ro
    networks: [data]
    mem_limit: 128m
    pids_limit: 50
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/redis-cli -p 26379 ping"]
      interval: 10s
      timeout: 3s
      retries: 6

  # --- Redis RATE-LIMIT (SPEC 3.5): efimero, allkeys-lru, sin AOF ------------
  redis-ratelimit:
    image: redis:7.2
    profiles: ["core", "full"]
    <<: *hardening-data
    read_only: true
    secrets: [redis_ratelimit_password]
    entrypoint: ["/bin/sh", "-c", "export REDIS_RATELIMIT_PASSWORD=$$(cat /run/secrets/redis_ratelimit_password); exec redis-server /usr/local/etc/redis/redis.conf --requirepass $$REDIS_RATELIMIT_PASSWORD"]
    volumes:
      - ./redis/ratelimit.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-ratelimit-data:/data
    networks: [data]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 100
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 3s
      retries: 6

  # --- rate-limiter (P1-04): servicio ForwardAuth sobre el Redis efimero -----
  # Solo red interna: no se publica al host. Lee la password desde el secret,
  # nunca inline. Identidad por cliente y tuning distribuido quedan para S7
  # (ADR-0005); esta version minima da 429 en el gateway.
  ratelimitd:
    build:
      context: ../../platform-services/rate-limiter
      dockerfile: Dockerfile
    image: ratelimitd:p4-04
    profiles: ["full"]
    <<: *hardening
    user: "10001:10001"
    read_only: true
    secrets:
      - redis_ratelimit_password
      - minio_webhook_secret
      # S11-P1-C06: Consul KV de solo lectura (config/rate-limiter/ + config/meta/).
      - consul_ratelimitd_token
      - consul_ca_cert
    environment:
      LISTEN_ADDR: ":8090"
      # S11-P1-C06: cliente KV de Consul; secretos siempre por archivo.
      CONSUL_HTTP_ADDR: https://consul:8501
      CONSUL_CACERT: /run/secrets/consul_ca_cert
      CONSUL_TOKEN_FILE: /run/secrets/consul_ratelimitd_token
      REDIS_ADDR: redis-ratelimit:6379
      REDIS_PASSWORD_FILE: /run/secrets/redis_ratelimit_password
      # S7-P4-05: el webhook interno queda exento solo si presenta el token
      # que MinIO inyecta como `Authorization: Bearer <secreto>`.
      RL_WEBHOOK_TOKEN_FILE: /run/secrets/minio_webhook_secret
      RL_WEBHOOK_PATH: ${DOC_SERVICE_WEBHOOK_PATH:-/internal/storage/events}
      # S11-P1-C17: registro de la replica en el agente local de Consul.
      SERVICE_NAME: ratelimitd
      CONSUL_REGISTRATION_ADDR: https://consul-agent:8501
      CONSUL_REGISTRATION_DISABLED: ${CONSUL_REGISTRATION_DISABLED:-false}
    volumes:
      - ratelimitd-config-cache:/var/lib/ratelimitd
    networks: [internal, data]
    depends_on:
      redis-ratelimit:
        condition: service_healthy
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 100
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  # --- slo-exporter (S5-P4-03): exporta metricas de SLO windowed sobre Mongo.
  # Servicio scrape-only: solo lectura sobre Mongo, no modifica datos.
  slo-exporter:
    build:
      context: ../../platform-services/slo-exporter
      dockerfile: Dockerfile
    image: slo-exporter:s5-p4-03
    profiles: ["full"]
    <<: *hardening
    user: "10001:10001"
    read_only: true
    environment:
      LISTEN_ADDR: ":9100"
      MONGO_URI: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/${MONGO_DATABASE:-documents}?replicaSet=rs0
      MONGO_DB: ${MONGO_DATABASE:-documents}
      SLO_WINDOW_HOURS: "24"
    networks: [internal, data]
    depends_on:
      mongo:
        condition: service_healthy
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 100
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9100/metrics"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  # --- MinIO (SPEC 3.4): API S3 interna; exposicion publica SOLO via Traefik -
  # NOTA: la imagen oficial minio/minio no esta accesible desde este entorno
  # (Docker Hub deniega el pull). Se usa la imagen legacy de Bitnami con tag
  # INMUTABLE, funcionalmente equivalente para desarrollo local.
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    profiles: ["core", "full"]
    <<: *hardening-data
    secrets: [minio_root_password]
    environment:
      # El entrypoint de Bitnami y `mc` escriben su config en $HOME/.mc. Como el
      # rootfs es de solo lectura y por defecto la conf cae en "/.mc", el arranque
      # fallaba en bucle; el home y la conf de mc deben vivir en el tmpfs de /tmp.
      HOME: /tmp
      MINIO_CLIENT_CONF_DIR: /tmp/.mc
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?definir en .env}
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      # S1-P1-13: scrape Prometheus sin token en local (red `data` interna).
      MINIO_PROMETHEUS_AUTH_TYPE: "public"
      # Webhook declarativo -> doc-service (SPEC §5.2 / S3-P2-05).
      # Bitnami aplica MINIO_NOTIFY_WEBHOOK_* al arrancar: el target existe sin
      # depender de `mc admin service restart` (que sin TTY no aplica la config).
      MINIO_NOTIFY_WEBHOOK_ENABLE_DOCSERVICE: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_DOCSERVICE: ${DOC_SERVICE_WEBHOOK_URL:-http://doc-service:8080/internal/storage/events}
      MINIO_NOTIFY_WEBHOOK_AUTH_TOKEN_DOCSERVICE: ${MINIO_WEBHOOK_SECRET:?definir en .env}
    volumes:
      - minio-data:/bitnami/minio/data
    networks: [data]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 200
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Buckets + identidades por servicio (minimo privilegio, S0-P1-05/S1-P1-05).
  # Idempotente: el job se puede reejecutar sin efectos colaterales.
  minio-init:
    image: bitnamilegacy/minio-client:2025.7.21
    profiles: ["core", "full"]
    depends_on:
      minio:
        condition: service_healthy
    secrets:
      - minio_root_password
      - minio_webhook_secret
      - svc_docservice_access_key
      - svc_docservice_secret_key
      - svc_worker_access_key
      - svc_worker_secret_key
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
      SVC_DOCSERVICE_ACCESS_KEY_FILE: /run/secrets/svc_docservice_access_key
      SVC_DOCSERVICE_SECRET_KEY_FILE: /run/secrets/svc_docservice_secret_key
      SVC_WORKER_ACCESS_KEY_FILE: /run/secrets/svc_worker_access_key
      SVC_WORKER_SECRET_KEY_FILE: /run/secrets/svc_worker_secret_key
      # Retencion configurable por entorno (T-05); defaults = decision de negocio.
      RAW_PDFS_EXPIRE_DAYS: ${RAW_PDFS_EXPIRE_DAYS:-7}
      EXTRACTED_TXT_EXPIRE_DAYS: ${EXTRACTED_TXT_EXPIRE_DAYS:-30}
    volumes:
      - ./minio/init-buckets.sh:/init-buckets.sh:ro
      - ./minio/lifecycle-buckets.sh:/lifecycle-buckets.sh:ro
      - ./minio/init-all.sh:/init-all.sh:ro
    entrypoint: ["/bin/sh", "/init-all.sh"]
    networks: [data]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 100
    restart: "no"

  # Notificaciones de bucket (webhook) -> doc-service (SPEC §5.2).
  # Separado de minio-init para que el perfil `core` no dependa del doc-service.
  # El target webhook lo declara el servicio minio via MINIO_NOTIFY_WEBHOOK_*
  # (token de una sola fuente, aplicado en cada arranque); este job solo
  # verifica el target y suscribe el evento (S3-P1-03).
  minio-notify-init:
    image: bitnamilegacy/minio-client:2025.7.21
    profiles: ["full"]
    depends_on:
      minio:
        condition: service_healthy
      doc-service:
        condition: service_started
    secrets:
      - minio_root_password
      - minio_webhook_secret
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
      DOC_SERVICE_WEBHOOK_URL: ${DOC_SERVICE_WEBHOOK_URL:-http://doc-service:8080/internal/storage/events}
    volumes:
      - ./minio/init-notifications.sh:/init-notifications.sh:ro
    entrypoint: ["/bin/sh", "/init-notifications.sh"]
    networks: [data]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 100
    restart: "no"

  # ===========================================================================
  # PERFIL FULL — gateway + monolito (Strangler) + observabilidad
  # ===========================================================================

  # --- Traefik v3: entrypoint UNICO. Hoy enruta el 100% al monolito y el S3.
  # Cuando exista doc-service se activa el router /api/v2/documents (labels).
  traefik:
    image: traefik:v3.7
    user: "65532"
    # Provider Docker: el usuario 65532 debe pertenecer al grupo del socket del
    # host (varia por maquina: getent group docker). Sin esto Traefik no puede
    # leer labels, los routers de los servicios no se crean y todo responde 404.
    group_add: ["${DOCKER_GID:?definir en .env}"]
    profiles: ["full"]
    <<: *hardening
    read_only: true
    secrets: [consul_ui_users, consul_ca_cert]
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    environment:
      # El cliente Docker de Traefik negocia una API vieja; algunos daemons
      # exigen >= 1.40. Se fija explicitamente (ajustar si el daemon varia).
      DOCKER_API_VERSION: "1.44"
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ../traefik/dynamic:/etc/traefik/dynamic:ro
      - ../traefik/certs:/etc/traefik/certs:ro
    networks: [edge, internal, data]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 6

  # --- Monolito FastAPI DETRAS del gateway (patron estrangulador, SPEC 2).
  # Sin puerto publicado al host: todo el trafico entra por Traefik.
  # La imagen se construye desde su propio repo: MONOLITO_IMAGE en .env.
  monolito:
    image: ${MONOLITO_IMAGE:-monolito:latest}
    # Si la imagen no existe, se construye desde el repo del monolito
    # (por defecto ../../../pdf-extractext; sobreescribir en .env)
    build:
      context: ${MONOLITO_BUILD_CONTEXT:-../../../pdf-extractext}
    profiles: ["full"]
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    environment:
      # Requeridas por el monolito (src/infrastructure/config/settings.py)
      MONGO_USER: ${MONOLITO_MONGO_USER}
      MONGO_PASS: ${MONOLITO_MONGO_PASSWORD}
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MONGO_DB: ${MONOLITO_MONGO_DB:-pdf-extractext}
      max_size: "26214400"   # 25 MB (limite historico del monolito)
      min_size: "1"
    networks: [internal, data]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200

  # --- doc-service (Go): contrato v2 + webhook de MinIO + reconciliador.
  # Sin puerto publicado al host: la API entra por Traefik (router /api/v2) y
  # el webhook entra por la red `data` (MinIO -> doc-service:8080).
  # La imagen se construye desde su propio repo (DOC_SERVICE_BUILD_CONTEXT).
  doc-service:
    image: ${DOC_SERVICE_IMAGE:-ghcr.io/alejo-basile/doc-service}:${DOC_SERVICE_TAG:-latest}
    profiles: ["full"]
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    secrets:
      - mongo_app_password
      - svc_docservice_access_key
      - svc_docservice_secret_key
      - redis_streams_password
      - minio_webhook_secret
      - internal_token
      # S11-P1-C06: Consul KV de solo lectura (config/doc-service/ + config/meta/).
      - consul_doc_service_token
      - consul_ca_cert
    volumes:
      - ./doc-service/entrypoint.sh:/entrypoint.sh:ro
      - doc-service-config-cache:/var/lib/doc-service
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    command: ["/usr/local/bin/api"]
    environment:
      HTTP_PORT: "8080"
      DEBUG: "false"
      # Mongo (replica set rs0), usuario de aplicacion con readWrite sobre la base.
      MONGO_URI: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/${MONGO_DATABASE:-documents}?replicaSet=rs0
      MONGO_DATABASE: ${MONGO_DATABASE:-documents}
      # MinIO: cliente interno (I/O) + endpoint publico (firma de URLs, SPEC §5.1).
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?definir en .env}
      MINIO_BUCKET_RAW: raw-pdfs
      MINIO_BUCKET_TXT: extracted-txt
      MINIO_BUCKET_MD: extracted-md
      MINIO_WEBHOOK_SECRET: ${MINIO_WEBHOOK_SECRET:?definir en .env}
      # Redis Streams (con password): publica los trabajos de extraccion.
      # S6-P1-01: modo Sentinel (SPEC 3.5). Con REDIS_ADDR fija el cliente queda
      # clavado al nodo que era primario al arrancar: tras un failover escribe
      # contra una replica y falla con READONLY (medido, ver
      # docs/evidencias/S6/S6-P1-01-failover-redis.txt). El binario ya soporta
      # FailoverClient; solo faltaba pasarle los sentinels.
      REDIS_SENTINEL_ADDRS: sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
      REDIS_MASTER_NAME: myprimary
      REDIS_PASSWORD_FILE: /run/secrets/redis_streams_password_json
      REDIS_STREAM_KEY: ${REDIS_STREAM_KEY:-stream:pdf-processing}
      # Proteccion de los endpoints /internal/*.
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?definir en .env}
      # Reglas de negocio (deben respetar grace >= 2 x intervalo y minSafetyAge).
      MAX_PDF_BYTES: "26214400"
      RECONCILE_INTERVAL_MIN: "10"
      DOC_UPLOAD_GRACE_MIN: "30"
      MIN_SAFETY_AGE_MIN: "15"
      # S11-P1-C06: cliente KV de Consul (lectura de su prefijo + config/meta).
      CONSUL_HTTP_ADDR: https://consul:8501
      CONSUL_CACERT: /run/secrets/consul_ca_cert
      CONSUL_TOKEN_FILE: /run/secrets/consul_doc_service_token
      CONFIG_CACHE_PATH: /var/lib/doc-service/config-cache.json
      # S11-P1-C14: el registro va contra el agente local, no contra el
      # server; el cliente KV lee CONSUL_HTTP_TOKEN_FILE (mismo secreto).
      CONSUL_HTTP_TOKEN_FILE: /run/secrets/consul_doc_service_token
      CONSUL_REGISTRATION_ADDR: https://consul-agent:8501
      SERVICE_NAME: doc-service
    networks: [internal, data]
    depends_on:
      mongo:
        condition: service_healthy
      redis-streams:
        condition: service_healthy
      minio:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 300
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  # --- doc-service canary: destino del weighted r-api-v2 con peso 0 por defecto.
  # Duplicado seguro: el relay deduplica y las transiciones Mongo son
  # condicionales (evidencia S4 horizontal-scaling).
  doc-service-canary:
    image: ${DOC_SERVICE_CANARY_IMAGE:-ghcr.io/alejo-basile/doc-service}:${DOC_SERVICE_CANARY_TAG:-latest}
    profiles: ["full"]
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    secrets:
      - mongo_app_password
      - svc_docservice_access_key
      - svc_docservice_secret_key
      - redis_streams_password
      - minio_webhook_secret
      - internal_token
      # S11-P1-C14: el canary es una réplica más de doc-service, así que se
      # registra con su propio ID (hostname único) y el mismo contrato de KV.
      - consul_doc_service_token
      - consul_ca_cert
    volumes:
      - ./doc-service/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    command: ["/usr/local/bin/api"]
    environment:
      HTTP_PORT: "8080"
      DEBUG: "false"
      MONGO_URI: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/${MONGO_DATABASE:-documents}?replicaSet=rs0
      MONGO_DATABASE: ${MONGO_DATABASE:-documents}
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?definir en .env}
      MINIO_BUCKET_RAW: raw-pdfs
      MINIO_BUCKET_TXT: extracted-txt
      MINIO_BUCKET_MD: extracted-md
      MINIO_WEBHOOK_SECRET: ${MINIO_WEBHOOK_SECRET:?definir en .env}
      REDIS_SENTINEL_ADDRS: sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
      REDIS_MASTER_NAME: myprimary
      REDIS_PASSWORD_FILE: /run/secrets/redis_streams_password_json
      REDIS_STREAM_KEY: ${REDIS_STREAM_KEY:-stream:pdf-processing}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?definir en .env}
      MAX_PDF_BYTES: "26214400"
      RECONCILE_INTERVAL_MIN: "10"
      DOC_UPLOAD_GRACE_MIN: "30"
      MIN_SAFETY_AGE_MIN: "15"
      # S11-P1-C06 / S11-P1-C14: KV y registro de esta réplica.
      CONSUL_HTTP_ADDR: https://consul:8501
      CONSUL_CACERT: /run/secrets/consul_ca_cert
      CONSUL_TOKEN_FILE: /run/secrets/consul_doc_service_token
      CONSUL_HTTP_TOKEN_FILE: /run/secrets/consul_doc_service_token
      CONSUL_REGISTRATION_ADDR: https://consul-agent:8501
      SERVICE_NAME: doc-service
    networks: [internal, data]
    depends_on:
      mongo:
        condition: service_healthy
      redis-streams:
        condition: service_healthy
      minio:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 300
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  # --- extraction-worker (SPEC 3.3): consumidor de Redis Streams ------------
  # S5-P4-01 publica la imagen; S5-P1-01 pone los limites. El PDF hostil se
  # contiene con tres capas distintas, no con una: timeout duro por trabajo
  # (WORKER_JOB_TIMEOUT_SECS), topes de parseo (paginas / bytes de salida) y
  # limites del contenedor (mem_limit / cpus / pids_limit / ulimits).
  #
  # INVARIANTE (SPEC 5.4): WORKER_MIN_IDLE_MS >= 2 x WORKER_JOB_TIMEOUT_SECS.
  # Si el idle de XAUTOCLAIM queda por debajo del timeout duro, otro worker
  # reclama un mensaje que el primero todavia esta procesando y dos instancias
  # extraen el mismo documento a la vez.
  #
  # Los tres valores salen de la medicion del 2026-11-01 (evidencia
  # docs/evidencias/S5/S5-P1-01-recursos-worker.txt): un PDF legitimo cercano
  # al tope de WORKER_MAX_PDF_BYTES (27,5 MiB, 12 paginas de imagen) tarda mas
  # de 150 s en extraerse. Con WORKER_JOB_TIMEOUT_SECS=60 el trabajo se abortaba
  # a mitad de camino y el documento quedaba en PROCESSING; por eso se usa el
  # default de 300 s, que mantiene la invariante con MIN_IDLE de 600 s.
  #
  # Nada de este servicio se publica al host: escucha /healthz, /readyz y
  # /metrics en la red interna para Prometheus (SPEC 10).
  # Digest pinning (S11-P1-C27): el digest inmutable se publica por
  # publish-image.yml y se fija por el operador con la referencia completa
  # `<imagen>@sha256:<digest>`. Compose solo soporta interpolacion de un
  # nivel (`${VAR:-default}`), por lo que no se puede combinar imagen/tag y
  # digest en una sola expresion sin romper el path basado en tags. La
  # variable opcional EXTRACTION_WORKER_DIGEST queda documentada en .env.example
  # (vacia = se usa la ruta por tag). Si se completa, el operador reemplaza
  # manualmente la linea `image:` por la referencia con digest. El bloque de
  # servicio de `ocr-worker` vive mas abajo (S11-P1-C28), no dentro de este.
  #
  # Digests publicados (run 44272090569, commit 374d339, linux/amd64):
  #   ghcr.io/alejo-basile/extraction-worker@sha256:839710e3457b14a66f4b59c4baf43ce96ba948431dafe61710bea07ebd4de88d
  #   ghcr.io/alejo-basile/ocr-worker@sha256:c406bbcaf7a08f324d2a76ebb0137e91244e9cfd5738948b76f13e87b8bf40a1
  extraction-worker:
    image: ${EXTRACTION_WORKER_IMAGE:-ghcr.io/alejo-basile/extraction-worker}:${EXTRACTION_WORKER_TAG:-latest}
    profiles: ["full"]
    <<: *hardening
    # El unico destino de escritura es /tmp (PDF descargado), cubierto por el
    # tmpfs acotado de abajo: por eso el rootfs puede ser de solo lectura.
    read_only: true
    secrets:
      - redis_streams_password
      - mongo_worker_password
      - svc_worker_access_key
      - svc_worker_secret_key
      # S11-P1-C06: Consul KV de solo lectura (config/extraction-worker/ + config/meta/).
      - consul_worker_token
      - consul_ca_cert
    environment:
      HTTP_PORT: "8081"
      # S11-P1-C06: cliente KV de Consul; secretos siempre por archivo.
      CONSUL_HTTP_ADDR: https://consul:8501
      CONSUL_CACERT: /run/secrets/consul_ca_cert
      CONSUL_TOKEN_FILE: /run/secrets/consul_worker_token
      # S11-P1-C18: registro de la replica en el agente local de Consul.
      CONSUL_REGISTRATION_ADDR: https://consul-agent:8501
      SERVICE_NAME: extraction-worker
      CONSUL_REGISTRATION_DISABLED: ${CONSUL_REGISTRATION_DISABLED:-false}
      # Redis Streams: la password llega por archivo y el entrypoint de la
      # imagen arma REDIS_URL. Nunca en texto plano en este compose (SPEC 9).
      REDIS_HOST: redis-streams
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_PASSWORD_FILE: /run/secrets/redis_streams_password
      # Compose los omite si no estan definidos; definir ambos activa Sentinel.
      REDIS_SENTINEL_ADDRS:
      REDIS_MASTER_NAME:
      REDIS_STREAM: ${REDIS_STREAM_KEY:-stream:pdf-processing}
      REDIS_GROUP: extraction-workers
      REDIS_DLQ_STREAM: ${REDIS_STREAM_KEY:-stream:pdf-processing}-dlq
      # Mongo con rol acotado a update sobre documents (ADR-0006, SPEC 6.3).
      MONGO_HOST: mongo
      MONGO_WORKER_USER: ${MONGO_WORKER_USER:?definir en .env}
      MONGO_WORKER_PASSWORD_FILE: /run/secrets/mongo_worker_password
      MONGO_DB: ${MONGO_DATABASE:-documents}
      MONGO_TIMEOUT_MS: "3000"
      # MinIO con credenciales propias del worker, nunca la root (SPEC 3.4).
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET_RAW: raw-pdfs
      S3_BUCKET_TXT: extracted-txt
      S3_ACCESS_KEY_FILE: /run/secrets/svc_worker_access_key
      S3_SECRET_KEY_FILE: /run/secrets/svc_worker_secret_key
      S3_OP_TIMEOUT_MS: "60000"
      # Contencion del PDF hostil (SPEC 3.3). Ver INVARIANTE arriba.
      WORKER_JOB_TIMEOUT_SECS: "300"
      WORKER_MAX_CONCURRENCY: "4"
      WORKER_MIN_IDLE_MS: "600001"
      WORKER_DEAD_CONSUMER_MS: "600001"
      WORKER_MAX_ATTEMPTS: "5"
      WORKER_MAX_PAGES: "2000"
      WORKER_MAX_PDF_BYTES: "31457280"
      WORKER_MAX_OUTPUT_BYTES: "52428800"
      WORKER_BLOCK_MS: "5000"
      WORKER_XAUTOCLAIM_INTERVAL_SECS: "30"
      WORKER_METRICS_INTERVAL_SECS: "15"
      WORKER_SHUTDOWN_DRAIN_SECS: "4"
      RUST_LOG: ${RUST_LOG:-info}
      LOG_FORMAT: json
    networks: [internal, data]
    # S11-P1-C13: cache last-known-good del cliente KV de Consul. El rootfs es
    # de solo lectura, asi que la cache necesita un volumen propio y nombrado.
    volumes:
      - worker-config-cache:/var/lib/worker
    depends_on:
      mongo:
        condition: service_healthy
      redis-streams:
        condition: service_healthy
      minio:
        condition: service_healthy
    # S5-P1-01: valores calibrados con la prueba de carga del 2026-11-01.
    # Medido con /sys/fs/cgroup/memory.peak (no con docker stats, que suaviza):
    #   4 x PDF de 400 paginas (234 KB)  -> 64 MiB  (completan en < 20 s)
    #   4 x PDF de 27,5 MiB              -> 289 MiB (abortados por el timeout)
    #   1 x PDF de 27,5 MiB              -> 109 MiB (completa en > 150 s)
    # El peor caso teorico es 4 x 109 MiB = ~436 MiB, asi que 768m deja 1,7x
    # sobre esa extrapolacion. Detalle en
    # docs/evidencias/S5/S5-P1-01-recursos-worker.txt.
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 200
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
      nproc:
        soft: 200
        hard: 200
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  # --- ocr-worker (S11-P1-C28): consumidor OCR de Redis Streams ---------------
  # Imagen fijada por digest publicado en C27 (infra/docs/evidencias/S11/S11-P1-C27-digests.txt).
  ocr-worker:
    image: ${OCR_WORKER_IMAGE:-ghcr.io/alejo-basile/ocr-worker}@${OCR_WORKER_DIGEST:-sha256:c406bbcaf7a08f324d2a76ebb0137e91244e9cfd5738948b76f13e87b8bf40a1}
    profiles: ["full"]
    <<: *hardening
    read_only: true
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    command: ["/usr/local/bin/ocr-worker"]
    volumes:
      - "./ocr-worker/entrypoint.sh:/entrypoint.sh:ro"
    secrets: [ocr_minio_access_key, ocr_minio_secret_key, ocr_mongo_password, redis_streams_password, consul_ocr_worker_token, consul_ca_cert]
    environment:
      REDIS_HOST: redis-streams
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_PASSWORD_FILE: "/run/secrets/redis_streams_password"
      MONGO_OCR_HOST: mongo
      MONGO_OCR_USER: ${OCR_MONGO_USER:-ocr-worker}
      MONGO_OCR_PASSWORD_FILE: /run/secrets/ocr_mongo_password
      MONGO_OCR_DB: ${MONGO_DATABASE:-documents}
      # El binario lee MONGO_DB: se mantiene separado de MONGO_OCR_DB (que arma
      # el URI + authSource en el entrypoint) y se cita para no compartir la
      # linea exacta con extraction-worker (guardarrail C25 Check 5).
      MONGO_DB: "${MONGO_DATABASE:-documents}"
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET_RAW: raw-pdfs
      S3_BUCKET_TXT: extracted-txt
      S3_ACCESS_KEY_FILE: /run/secrets/ocr_minio_access_key
      S3_SECRET_KEY_FILE: /run/secrets/ocr_minio_secret_key
      OCR_DPI: "150"
      OCR_LIMIT_W: "3500"
      OCR_LIMIT_PIX: "12000000"
      OCR_LANG: spa+eng
      OCR_OEM: "1"
      OCR_PSM: "3"
      OCR_MAX_ATTEMPTS: "3"
      OCR_CONSUMER_BLOCK_MS: "5000"
      OCR_CONSUMER_COUNT: "1"
      REDIS_OCR_STREAM: ${REDIS_OCR_STREAM:-stream:ocr-processing}
      REDIS_OCR_GROUP: ${REDIS_OCR_GROUP:-ocr-workers}
      REDIS_OCR_DLQ_STREAM: ${REDIS_OCR_DLQ_STREAM:-stream:ocr-processing-dlq}
      METRICS_ADDR: "0.0.0.0:8080"
      CONSUL_REGISTRATION_ADDR: https://consul-agent:8501
      SERVICE_NAME: ocr-worker
      CONSUL_REGISTRATION_DISABLED: ${CONSUL_REGISTRATION_DISABLED:-false}
      CONSUL_CACERT: "/run/secrets/consul_ca_cert"
      CONSUL_TOKEN_FILE: /run/secrets/consul_ocr_worker_token
      RUST_LOG: ${RUST_LOG:-info}
    networks: [internal, data]
    depends_on:
      mongo:
        condition: service_healthy
      redis-streams:
        condition: service_healthy
      minio:
        condition: service_healthy
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 200
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
      nproc:
        soft: 200
        hard: 200
    tmpfs:
      - /tmp:size=512m,noexec,nosuid,nodev
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  # --- Observabilidad (SPEC 10) ---------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.4
    profiles: ["full"]
    <<: *hardening
    ports:
      - "9090:9090"
    # S11-P1-C06: token de lectura de servicios/nodos para consul_sd (C08).
    secrets: [consul_prometheus_token, consul_ca_cert]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-data:/prometheus
    networks: [internal, data]
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 100
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev

  # --- Alertmanager (S1-P1-13, plan-S2-P1.md §4) -------------------------------
  # Receiver local (log/store); en staging/prod se agrega webhook/email aqui.
  # Solo red `internal`: no necesita egress (internal:true) ni llegar a `data`.
  alertmanager:
    image: prom/alertmanager:v0.34.1
    profiles: ["full"]
    <<: *hardening
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    ports:
      - "9093:9093"
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks: [internal]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 50
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 6

  # --- redis-exporter (S1-P1-13): expone Streams para QueueDepth/PEL/DLQ ------
  # redis_stream_length solo aparece con check-single-streams (v1.90+).
  # S4-P1-03: incluir tanto stream principal como DLQ para alertas de cadena.
  #
  # El secreto se pasa por REDIS_PASSWORD_FILE, NUNCA por argv: un flag
  # --redis.password queda visible en /proc/<pid>/cmdline y contradice el
  # patron *_FILE que usa el resto del stack (commit b42c65b).
  # Formato obligatorio del JSON (mapa URI -> password, ver contrib/sample-pwd-file.json
  # de redis_exporter): {"redis://redis-streams:6379": "<password>"}
  # OJO: la clave es la URI completa del REDIS_ADDR, no "password".
  # No se usa `command:` con shell: la imagen no trae /bin/sh.
  redis-exporter:
    image: oliver006/redis_exporter:v1.93.0
    profiles: ["full"]
    <<: *hardening
    secrets: [redis_streams_password_json]
    environment:
      REDIS_ADDR: redis://redis-streams:6379
      REDIS_PASSWORD_FILE: /run/secrets/redis_streams_password_json
      REDIS_EXPORTER_CHECK_SINGLE_STREAMS: stream:pdf-processing,stream:pdf-processing-dlq
    networks: [data]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 50
    read_only: true
    depends_on:
      redis-streams:
        condition: service_healthy
    # Sin healthcheck: la imagen Alpine del exporter no tiene shell ni
    # utilerias (sh/ps/pgrep/nc). Proteccion real: restart + Prometheus job down.

  loki:
    image: grafana/loki:3.4.2
    profiles: ["full"]
    <<: *hardening
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks: [internal]
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 100
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev

  promtail:
    image: grafana/promtail@sha256:6140a3158fddd7ef2276908bd321ad5265ee6ad2abd9fb3c937394827df3ea4d # grafana/promtail:3.6.5
    profiles: ["full"]
    <<: *hardening
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-positions:/positions
    networks: [internal]
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 100
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    healthcheck:
      # La imagen de promtail no trae curl ni wget; el chequeo HTTP se hace con
      # bash + /dev/tcp, que si estan disponibles en la base Debian de la imagen.
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/9080 && printf 'GET /ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200'",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  grafana:
    image: grafana/grafana:11.6.0
    profiles: ["full"]
    <<: *hardening
    ports:
      - "3000:3000"
    secrets: [grafana_admin_password]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD_FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [internal]
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 100
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    depends_on:
      - prometheus
      - loki

  # ===========================================================================
  # DISCOVERY — S11-P1-C04 (Consul)
  # ===========================================================================
  consul:
    image: hashicorp/consul:${CONSUL_IMAGE_TAG:?definir en .env}
    profiles: ["discovery", "full"]
    <<: *hardening-data
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    command: ["agent", "-config-dir=/consul/config"]
    volumes:
      - consul-data:/consul/data
      - ./consul/config/server.hcl:/consul/config/server.hcl:ro
      - ./consul/config/dev-server.local.hcl:/consul/config/dev-server.local.hcl:ro
    secrets:
      - consul_gossip_key
      - consul_server_cert
      - consul_server_key
      - consul_ca_cert
      - consul_operator_token
    environment:
      CONSUL_DATACENTER: ${CONSUL_DATACENTER:-dc1}
      CONSUL_NODE_NAME: consul
    networks: [internal]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 200
    healthcheck:
      test: ["CMD-SHELL", "consul operator raft list-peers -http-addr=https://127.0.0.1:8501 -ca-file=/run/secrets/consul_ca_cert -token-file=/run/secrets/consul_operator_token >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  consul-agent:
    image: hashicorp/consul:${CONSUL_IMAGE_TAG:?definir en .env}
    profiles: ["discovery", "full"]
    <<: *hardening-data
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    command: ["agent", "-config-dir=/consul/config"]
    volumes:
      - consul-agent-data:/consul/data
      - ./consul/config/agent.hcl:/consul/config/agent.hcl:ro
      - ./consul/config/dev-agent.local.hcl:/consul/config/dev-agent.local.hcl:ro
    secrets:
      - consul_gossip_key
      - consul_ca_cert
      - consul_server_cert
      - consul_server_key
      - consul_operator_token
    networks: [internal]
    depends_on:
      consul:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 100
    healthcheck:
      test: ["CMD-SHELL", "consul members -http-addr=https://127.0.0.1:8501 -ca-file=/run/secrets/consul_ca_cert -token-file=/run/secrets/consul_operator_token | grep -q alive"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  consul-kv-sync:
    image: curlimages/curl:${CURL_IMAGE_TAG:?definir en .env}
    profiles: ["discovery", "full"]
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    secrets:
      - consul_operator_token
      - consul_ca_cert
    volumes:
      - ./consul/kv:/kv:ro
      - ./consul/config/schema.json:/schema.json:ro
      - ../scripts/consul-kv-sync.sh:/consul-kv-sync.sh:ro
    entrypoint: ["/bin/sh", "/consul-kv-sync.sh"]
    environment:
      CONSUL_HTTP_ADDR: https://consul:8501
      CONSUL_CACERT: /run/secrets/consul_ca_cert
      CONSUL_HTTP_TOKEN_FILE: /run/secrets/consul_operator_token
      KV_DIR: /kv
      SCHEMA_FILE: /schema.json
      # S11-P1-C07: short git SHA recorded in config/meta/revision.
      CONSUL_KV_REVISION: ${CONSUL_KV_REVISION:-unknown}
    networks: [internal]
    mem_limit: 64m
    cpus: 0.1
    pids_limit: 50
    restart: "no"
    depends_on:
      consul:
        condition: service_healthy

  # ===========================================================================
  # PERFIL CHAOS — utilidades para pruebas de fallo (game day S9)
  # ===========================================================================
  pumba:
    image: gaiaadm/pumba:0.11.0
    profiles: ["chaos"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --help
    networks: []
    mem_limit: 64m
    cpus: 0.1
    pids_limit: 50
    restart: "no"
