# S5-P1-04 — Scrape y alertas del stack aislado de MinIO.
#
# MinIO de prueba expone /minio/v2/metrics/cluster con
# MINIO_PROMETHEUS_AUTH_TYPE=public (ver docker-compose.test-minio-disk.yml).
# Se cargan las reglas REALES de alert.rules.yml para probar 70/85.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager-test:9093"]

scrape_configs:
  - job_name: minio-test
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio-test:9000"]
