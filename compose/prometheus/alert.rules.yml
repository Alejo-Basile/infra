# S1-P1-13 — Alertas accionables (plan-S2-P1.md §4).
# Cada alerta trae la ACCION en annotations (description/runbook), no solo el sintoma.
# Senales:
# - Queue/PEL/DLQ via redis-exporter con check-single-streams (redis_stream_length).
#   PEL usa redis_stream_group_pending si el exporter lo expone.
# - HighErrorRate/LatencyP95High via Traefik (doc-service solo expone 2 counters,
#   sin http_requests_total ni histograma — deuda S3, no se toca Go en S2).
# - MinioDiskHigh via /minio/v2/metrics/cluster (MINIO_PROMETHEUS_AUTH_TYPE=public).
# - RedisMemHigh via redis_memory_used_bytes/max_bytes (streams.conf: 192mb noeviction).
# - S4-P1-02: DocsStuck, DocsAccumulating (metrics de negocio desde doc-service).
# - S4-P1-03: QueueNotAdvancing, DLQNotEmpty (alertas de cadena completa).
groups:
  - name: s1-p1-13-streams
    interval: 15s
    rules:
      - alert: QueueDepthHigh
        # S5-P1-02 (medido en el ensayo real): NI XLEN NI el lag por separado
        # representan el trabajo pendiente.
        #   - XLEN nunca baja (las entradas quedan hasta XDEL/XTRIM).
        #   - lag (entradas no entregadas) cae a 0 apenas el reader prefetchea,
        #     aunque queden cientos de documentos sin procesar: la alerta
        #     resolvia con 443/700 pendientes.
        #   - En Redis 7.2.16 el campo lag de XINFO GROUPS es nil (el exporter
        #     lo mapea a 0), por eso no se usa redis_stream_group_lag.
        # El backlog real es no entregado + entregado sin confirmar.
        #   no entregado = redis_stream_entries_added_total - redis_stream_group_entries_read
        #   entregado sin confirmar = PEL (redis_stream_group_messages_pending)
        expr: (redis_stream_entries_added_total{stream="stream:pdf-processing"} - ignoring(group) redis_stream_group_entries_read{stream="stream:pdf-processing",group="extraction-workers"} + ignoring(group) redis_stream_group_messages_pending{stream="stream:pdf-processing",group="extraction-workers"}) > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "XLEN de stream:pdf-processing supera 500 por 5m"
          description: "Comparar XLEN con XPENDING/lag y documentos no terminales antes de escalar. Si es backlog real, escalar workers con docker compose --profile full up -d --scale extraction-worker=N."
          runbook_url: "infra/runbooks/escalado-worker.md"

      - alert: PELBacklog
        # S5-P1-02: el PEL no mide backlog de cola sino mensajes ENTREGADOS y no
        # confirmados. Un consumidor sano lo mantiene acotado a su concurrencia;
        # sube solo si los workers estan trabados o murieron con trabajo en vuelo.
        # Se usa la serie del exporter (no worker_pel_pending) para que la alerta
        # siga teniendo datos aunque no quede ningun worker vivo.
        expr: redis_stream_group_messages_pending{stream="stream:pdf-processing",group="extraction-workers"} > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "PEL pendiente mayor a 100 por 10m"
          description: "Revisar workers caidos o trabados; XAUTOCLAIM reasigna los mensajes huerfanos. Ver runbook failover-redis."
          runbook_url: "infra/runbooks/failover-redis.md"

      - alert: PELStale
        expr: redis_stream_group_messages_pending{stream="stream:pdf-processing",group="extraction-workers"} > 0 and max by (stream, group) (redis_stream_group_consumer_idle_seconds{stream="stream:pdf-processing",group="extraction-workers"}) > 600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Mensajes PEL con consumidores inactivos mas de 10 minutos"
          description: "Revisar workers caidos y XPENDING; confirmar que XAUTOCLAIM reclama entradas tras min-idle-time >= 2 x timeout duro."
          runbook_url: "infra/runbooks/failover-redis.md"

      - alert: ExtractionErrors
        expr: sum(rate(worker_documents_total{outcome="rejected"}[5m])) + sum(rate(worker_dlq_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Se observan errores de extraccion o documentos rechazados"
          description: "Inspeccionar stream:pdf-processing-dlq y el corpus causante; no reintentar REJECTED y corregir antes de replay."
          runbook_url: "infra/runbooks/errores-extraccion.md"

      - alert: RedisMemHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis streams sobre 80 por ciento de maxmemory (192mb)"
          description: "Revisar consumidores lentos. NO subir maxmemory: con noeviction la escritura debe fallar y alertarse, nunca desalojar mensajes del stream."
          runbook_url: "infra/runbooks/failover-redis.md"

  - name: s1-p1-13-http
    interval: 15s
    rules:
      - alert: HighErrorRate
        expr: sum(rate(traefik_service_requests_total{code=~"5.."}[5m])) / sum(rate(traefik_service_requests_total[5m])) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Tasa de 5xx sobre 1 por ciento por 5m (via Traefik)"
          description: "Revisar logs del servicio (Loki/Grafana); si coincide con un deploy, hacer rollback. Proxy Traefik porque doc-service aun no expone http_requests_total (deuda S3)."
          runbook_url: "infra/runbooks/gateway-trafico.md"

      - alert: LatencyP95High
        expr: histogram_quantile(0.95, sum(rate(traefik_service_request_duration_seconds_bucket[5m])) by (le)) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 sobre 500ms por 5m (via Traefik)"
          description: "Revisar Mongo/Redis (lentas); considerar escalar doc-service. Proxy Traefik porque doc-service aun no expone histograma (deuda S3)."
          runbook_url: "infra/runbooks/gateway-trafico.md"

      - alert: TraefikRateLimited
        expr: sum(rate(traefik_service_requests_total{code="429"}[5m])) / clamp_min(sum(rate(traefik_service_requests_total[5m])), 0.001) > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Mas de 1 por ciento de respuestas Traefik son 429 por 5m"
          description: "Confirmar que el middleware rate-limit activo explica los 429; distinguirlos de errores 5xx/backend no disponible."
          runbook_url: "infra/runbooks/gateway-trafico.md"

  - name: s1-p1-13-infra
    interval: 30s
    rules:
      # S5-P1-04: el expr anterior (minio_cluster_disk_used_bytes /
      # minio_cluster_disk_total_bytes) usaba metricas que NO existen en
      # minio 2025.7.23 —verificado contra /minio/v2/metrics/cluster—, asi que
      # la regla era NoData permanente. capacity_usable_free/total si existe y
      # mide presion real de disco sobre el volumen que respalda los buckets.
      - alert: MinioDiskHigh
        expr: (1 - minio_cluster_capacity_usable_free_bytes / minio_cluster_capacity_usable_total_bytes) > 0.80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disco de MinIO sobre 80 por ciento"
          description: "Purgar huerfanos (reconciliador) y confirmar lifecycle raw-pdfs 7d / extracted-txt 30d. Con el disco lleno MinIO rechaza escrituras y el pipeline se detiene. Ver runbook."
          runbook_url: "infra/runbooks/minio-espacio.md"

      - alert: MinioDiskCritical
        expr: (1 - minio_cluster_capacity_usable_free_bytes / minio_cluster_capacity_usable_total_bytes) > 0.85
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disco de MinIO sobre 85 por ciento (riesgo de rechazar escrituras)"
          description: "Actuar ya: purgar huerfanos, verificar lifecycle y ampliar el volumen. Por encima de 85 por ciento no hay margen para una rafaga normal de PDFs de 25 MB. Ver runbook."
          runbook_url: "infra/runbooks/minio-espacio.md"

  - name: s4-p1-02-business
    interval: 30s
    rules:
      # S4-P1-02: Documentos atascados en estados intermedios operativos (> 15 min = 900s)
      # Estados: UPLOADED, QUEUED, PROCESSING, RETRYING, EXTRACTION_FAILED, COMPENSATING
      # PENDING_UPLOAD EXCLUIDO: su duracion depende de la ventana de subida del cliente.
      - alert: DocsStuck
        expr: max by (status) (docservice_documents_oldest_intermediate_age_seconds) > 900
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Documento en estado intermedio ({{ $labels.status }}) hace mas de 15 min"
          description: "Revisar reconciliador (intervalo 5-10 min) y consumidores. Estados intermedios operativos: UPLOADED, QUEUED, PROCESSING, RETRYING, EXTRACTION_FAILED, COMPENSATING. PENDING_UPLOAD excluido (ventana de subida del cliente)."
          runbook_url: "infra/runbooks/reconciliador-documentos.md"

      # S4-P1-02: Acumulación de documentos no terminales operativos (> 10 por 15 min)
      # Reemplaza el placeholder DocsNonTerminal que quedaba en NoData.
      # No terminales operativos = todos menos COMPLETED, FAILED, REJECTED, UPLOAD_EXPIRED, PENDING_UPLOAD
      - alert: DocsAccumulating
        expr: docservice_documents_non_terminal > 10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Mas de 10 documentos en estados no terminales operativos por 15 min"
          description: "La cola o el procesamiento no drena. Revisar PEL, DLQ, dependencias y workers. Metrica: docservice_documents_non_terminal (excluye PENDING_UPLOAD y terminales)."
          runbook_url: "infra/runbooks/reconciliador-documentos.md"

  - name: s4-p1-03-chain
    interval: 30s
    rules:
      # S4-P1-03: La cola no avanza (profundidad constante > 0 durante 5 min)
      # La ventana de 5 min ya esta en changes(...[5m]); NO agregar 'for: 5m' adicional
      # (duplicaria el tiempo a ~10 min). Anti-flapping opcional: for: 1m (~6 min total).
      # S5-P1-02: companera obligatoria de las alertas de cola. Si el worker
      # esta caido, worker_stream_depth y worker_pel_pending no tienen serie
      # (NoData) y Alertmanager no alerta por NoData: el backlog crece en
      # silencio. Esta regla es la que rompe ese silencio.
      - alert: WorkerDown
        expr: up{job="extraction-worker"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "extraction-worker caido o no scrapeable por 10m"
          description: "Ningun worker consume la cola: el PEL y el stream crecen sin atencion. Revisar el contenedor y escalar segun el runbook de escalado (ADR-0019). Ojo: esta alerta dispara mientras el worker no este desplegado."
          runbook_url: "infra/runbooks/healthchecks.md"

      - alert: QueueNotAdvancing
        # S5-P1-02: con XLEN esta regla disparaba en falso SIEMPRE: las entradas
        # no se borran al consumirse, asi que > 0 y changes() == 0 son verdad
        # para un stream sano pero no trimeado. Con el PEL la senal es real: si
        # el PEL no se mueve, o no hay workers o estan trabados. Se usa la serie
        # del exporter para que siga existiendo sin workers vivos.
        expr: redis_stream_group_messages_pending{stream="stream:pdf-processing",group="extraction-workers"} > 0 and changes(redis_stream_group_messages_pending{stream="stream:pdf-processing",group="extraction-workers"}[5m]) == 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "El PEL de pdf-processing no avanza (mensajes entregados sin confirmar por 5m)"
          description: "Revisar consumidores, PEL y DLQ. Si no hay worker activo, escalar o reiniciar el consumidor. Ver runbook failover-redis."
          runbook_url: "infra/runbooks/failover-redis.md"

      # S4-P1-03: DLQ no vacía (fallos definitivos de extracción)
      # for: 0m = detección inmediata sin demora adicional.
      - alert: DLQNotEmpty
        expr: redis_stream_length{stream="stream:pdf-processing-dlq"} > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "DLQ con mensajes (fallos definitivos)"
          description: "Revisar XRANGE, corregir causa raiz y reintentar con la herramienta de replay. No borrar sin diagnosticar."
          runbook_url: "infra/runbooks/errores-extraccion.md"

      - alert: DocServiceNotReady
        expr: up{job="doc-service"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "doc-service no responde al scrape de /metrics"
          description: "Comprobar readiness y dependencias Mongo, MinIO y Redis; revisar logs y healthcheck antes de reiniciar."
          runbook_url: "infra/runbooks/healthchecks.md"

      # These alerts intentionally require exporters that expose their named
      # metrics; missing sources are tracked in the T4 evidence, never treated
      # as healthy values.
      - alert: SentinelFailoverObserved
        expr: increase(redis_sentinel_switch_master_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Sentinel reporto un cambio de maestro"
          description: "Verificar reconexion automatica de Go/Rust, direccion primaria y ventana de perdida mitigada por WAIT; la convergencia depende del reconciliador."
          runbook_url: "infra/runbooks/failover-redis.md"

      - alert: RedisPersistenceOrReplicaIssue
        expr: redis_aof_enabled == 0 or redis_master_link_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "AOF deshabilitado o replica Redis desconectada"
          description: "Restaurar AOF en el primario y diagnosticar INFO replication/master_link_status antes de intervenir en Sentinel."
          runbook_url: "infra/runbooks/failover-redis.md"

      - alert: AcmeCertificateExpiring
        expr: (traefik_tls_certs_not_after - time()) < 14 * 24 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Certificado TLS expira en menos de 14 dias"
          description: "Revisar almacenamiento ACME, resolucion DNS, challenge y logs de Traefik; no borrar acme.json sin respaldo."
          runbook_url: "infra/runbooks/certificados-traefik.md"
