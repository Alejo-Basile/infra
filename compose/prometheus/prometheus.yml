global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: traefik
    metrics_path: /metrics
    static_configs:
      - targets: ["traefik:8082"]
  - job_name: doc-service
    metrics_path: /metrics
    static_configs:
      - targets: ["doc-service:8080"]
  - job_name: redis-streams
    static_configs:
      - targets: ["redis-exporter:9121"]
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    scheme: http
    static_configs:
      - targets: ["minio:9000"]
