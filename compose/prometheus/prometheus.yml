global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: traefik
    metrics_path: /metrics
    static_configs:
      - targets: ["traefik:8082"]

  - job_name: app-services
    metrics_path: /metrics
    consul_sd_configs:
      - server: https://consul:8501
        authorization:
          credentials_file: /run/secrets/consul_prometheus_token
        tls_config:
          ca_file: /run/secrets/consul_ca_cert
        services:
          - svc-doc-service
          - svc-extraction-worker
    relabel_configs:
      - source_labels: [__meta_consul_service_id]
        target_label: instance
      - source_labels: [__meta_consul_service]
        target_label: service
      - source_labels: [__meta_consul_service_port]
        regex: ""
        action: drop

  - job_name: consul
    metrics_path: /v1/agent/metrics
    params:
      format: ["prometheus"]
    scheme: https
    tls_config:
      ca_file: /run/secrets/consul_ca_cert
    authorization:
      credentials_file: /run/secrets/consul_prometheus_token
    static_configs:
      - targets: ["consul:8501"]

  - job_name: redis-exporter
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]

  - job_name: ratelimitd
    metrics_path: /metrics
    static_configs:
      - targets: ["ratelimitd:8090"]

  # Alimenta los SLO windowed del pipeline (p50/p95/p99, terminal rate).
  # El target solo existe con el perfil `full`; sin el servicio figura `down`.
  - job_name: slo-exporter
    metrics_path: /metrics
    static_configs:
      - targets: ["slo-exporter:9100"]
