global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: traefik
    metrics_path: /metrics
    static_configs:
      - targets: ["traefik:8082"]

  - job_name: doc-service
    metrics_path: /metrics
    # dns_sd_configs para descubrir todas las réplicas de doc-service
    # en la red Docker 'infra_internal' (donde Traefik hace load balancing).
    # Requiere Docker Engine 20.10+ y que los contenedores tengan DNS resoluble.
    dns_sd_configs:
      - names:
          - "doc-service"
        type: "A"
        port: 8080
        refresh_interval: 30s
    # Fallback static_configs para entornos sin DNS SD
    # Se descomenta si dns_sd falla; en ese caso solo scrapea una réplica.
    # static_configs:
    #   - targets: ["doc-service:8080"]

  # Worker (SPEC 10): expone /healthz, /readyz y /metrics en 8081 con los
  # gauges de cola, PEL y DLQ. Sin este job las metricas worker_* se exponen
  # pero nadie las recoge, y las alertas de cola solo pueden depender del
  # exporter de Redis (que en la version actual no publica backlog real).
  # El target solo existe con el perfil `full`; si el worker no esta
  # levantado figura `down`, que es el estado esperado.
  - job_name: extraction-worker
    metrics_path: /metrics
    # El endpoint /metrics del worker no envia Content-Type; Prometheus v3.16
    # rechaza el scrape por defecto. Fallback temporal hasta que P3 corrija el
    # header (extraction-worker/crates/worker/src/http.rs:304-306).
    fallback_scrape_protocol: PrometheusText0.0.4
    static_configs:
      - targets: ["extraction-worker:8081"]

  - job_name: redis-exporter
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]
