# Redis STREAMS (cola de trabajo) — SPEC §3.5 / S0-P1-03
# Datos que NO deben perderse: persistencia AOF + politica noeviction.

appendonly yes
appendfsync everysec

# NUNCA desalojar mensajes del stream por presion de memoria: antes debe
# fallar la escritura (y alertarse) que perder trabajos encolados.
maxmemory 192mb
maxmemory-policy noeviction

# Sin salida publica: la red `data` es interna (internal: true).
protected-mode yes
