name: qa

on:
  pull_request:
    paths:
      - 'scripts/qa/**'
      - 'compose/docker-compose.test.yml'
      - 'scripts/bootstrap.sh'
      - 'Makefile'
      - '.github/workflows/qa.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/qa/**'
      - 'compose/docker-compose.test.yml'
      - 'scripts/bootstrap.sh'
      - 'Makefile'
      - '.github/workflows/qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          pip install yamllint
      # `qa.sh test infra --lint` exige el workspace multi-repo (doc-service/,
      # extraction-worker/, platform-services/) y este checkout solo trae infra/.
      # Se ejecutan los mismos chequeos que run_infra/lint. shellcheck se limita
      # a severidad error: los warnings existentes son deuda conocida y se
      # mantienen visibles sin bloquear el gate.
      - name: Lint
        run: |
          mapfile -t sh_files < <(git ls-files '*.sh')
          shellcheck -S error "${sh_files[@]}"
          yamllint -d relaxed .
          for f in "${sh_files[@]}"; do bash -n "$f"; done

  e2e:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # El stack se construye desde doc-service/ y extraction-worker/: sin los
      # repos hermanos (checkout multi-repo) no hay nada que levantar.
      - name: Detect multi-repo workspace
        id: workspace
        run: |
          if [ -d ../doc-service ] && [ -d ../extraction-worker ] && [ -d ../platform-services ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=qa e2e skipped::requires the multi-repo workspace (infra/, doc-service/, extraction-worker/, platform-services/); this checkout only has infra/, so the stack cannot be built"
          fi
      - name: Install tools
        if: steps.workspace.outputs.available == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl openssl
      - name: Bring up stack
        if: steps.workspace.outputs.available == 'true'
        run: ./scripts/qa/qa.sh up --init-secrets --profile full --timeout 300
      - name: Run e2e
        if: steps.workspace.outputs.available == 'true'
        run: ./scripts/qa/qa.sh e2e ci
      - name: Status on failure
        if: failure() && steps.workspace.outputs.available == 'true'
        run: ./scripts/qa/qa.sh status
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-artifacts
          path: .local/qa
          retention-days: 7
